<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch A Sketch</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h2>Etch A Sketch</h2>
    <div id="grid-container"></div>
    <div id="grid-controls">
        <div id="grid-dimension-container">
            <input type="range" min="16" max="100" value="16" id="grid-dimension-slider" name="grid-dimension-slider">
            <label id="grid-dimension-label" for="grid-dimension-slider">Dimenstions: 16 x 16</label>
        </div>
        
        <div id="grid-color-container">
            <input type="color" id="grid-color" name="grid-color">
            <label for="grid-color">Select a color</label>
        </div>

        <div id="grid-special-controls-container">
            <button class="special-button" id="grid-color-randomizer">Random Color Mode</button>
            <button class="special-button" id="grid-clear-button">Clear Grid</button>
            <button class="special-button" id="grid-eraser-button">Eraser</button>
        </div>
    </div>
</body>
</html>
