<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch A Sketch</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h2>Etch A Sketch</h2>
    <div id="grid-container"></div>
    <div id="grid-controls">
        <input type="range" min="16" max="100" value="16" id="grid-dimension-slider" name="grid-dimension-slider">
        <label for="grid-dimension-slider">Select the dimensions for your grid</label>
        
        <input type="color" id="grid-color" name="grid-color">
        <label for="grid-color">Select a color</label>
    </div>
</body>
</html>
